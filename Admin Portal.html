<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script type="text/babel">

// ─── BRAND TOKENS ────────────────────────────────────────────────────────────
const BRAND = {
  blue: '#0052C9', yellow: '#FEB81B', charcoal: '#1A202C', pageBed: '#F4F7FF',
  midBlue: '#3A7FDE', sky: '#B0C8F0', amber: '#E0A000', white: '#FFFFFF',
  red: '#D64545', green: '#1A7A4A', teal: '#0D9488',
};
const px = (c = BRAND.charcoal) => `4px 4px 0 ${c}`;
const pxSm = (c = BRAND.charcoal) => `2px 2px 0 ${c}`;

// ─── SHARED MICRO-COMPONENTS ─────────────────────────────────────────────────
const TIER_CFG = {
  calf: { label: 'CALF', bg: '#e5e7eb', color: BRAND.charcoal },
  cow:  { label: 'COW',  bg: BRAND.sky,  color: BRAND.blue },
  bull: { label: 'BULL', bg: '#BBF7D0',  color: '#166534' },
};
const STATUS_CFG = {
  active:         { label: 'ACTIVE',      bg: '#BBF7D0', color: '#166534' },
  suspended:      { label: 'SUSPENDED',   bg: '#FEE2E2', color: '#991B1B' },
  deactivated:    { label: 'DEACTIVATED', bg: '#e5e7eb', color: '#374151' },
  payment_failed: { label: 'FAILED',      bg: '#FEF3C7', color: '#92400E' },
};
const SEV_CFG = {
  critical:    { label: 'CRITICAL',    bg: '#D64545', color: '#fff' },
  high:        { label: 'HIGH',        bg: '#E0A000', color: '#fff' },
  medium:      { label: 'MEDIUM',      bg: '#0052C9', color: '#fff' },
  opportunity: { label: 'OPPORTUNITY', bg: '#1A7A4A', color: '#fff' },
  warning:     { label: 'WARNING',     bg: '#E0A000', color: '#fff' },
  low:         { label: 'LOW',         bg: '#e5e7eb', color: BRAND.charcoal },
};

function Badge({ type = 'tier', value, style = {} }) {
  const cfg = type === 'tier' ? TIER_CFG[value] : STATUS_CFG[value];
  if (!cfg) return null;
  return <span style={{ display:'inline-block', fontFamily:"'Press Start 2P',monospace", fontSize:'9px', padding:'3px 7px', background:cfg.bg, color:cfg.color, border:`2px solid ${BRAND.charcoal}`, boxShadow:pxSm(), letterSpacing:'0.04em', ...style }}>{cfg.label}</span>;
}
function SeverityBadge({ level }) {
  const cfg = SEV_CFG[level] || SEV_CFG.low;
  return <span style={{ display:'inline-block', fontFamily:"'Press Start 2P',monospace", fontSize:'8px', padding:'3px 6px', background:cfg.bg, color:cfg.color, border:`2px solid ${BRAND.charcoal}`, letterSpacing:'0.03em' }}>{cfg.label}</span>;
}
function Btn({ children, variant='primary', size='md', onClick, style={}, disabled=false }) {
  const [hov, setHov] = React.useState(false);
  const base = { fontFamily:"'Press Start 2P',monospace", fontSize:size==='sm'?'9px':size==='lg'?'13px':'10px', padding:size==='sm'?'6px 10px':size==='lg'?'14px 24px':'8px 14px', border:`3px solid ${BRAND.charcoal}`, cursor:disabled?'not-allowed':'pointer', opacity:disabled?0.5:1, transition:'box-shadow 0.08s,transform 0.08s', letterSpacing:'0.03em', display:'inline-flex', alignItems:'center', gap:'6px' };
  const variants = { primary:{background:BRAND.yellow,color:BRAND.charcoal,boxShadow:px()}, blue:{background:BRAND.blue,color:BRAND.white,boxShadow:px()}, ghost:{background:'transparent',color:BRAND.charcoal,boxShadow:px()}, danger:{background:BRAND.red,color:BRAND.white,boxShadow:px()}, dark:{background:BRAND.charcoal,color:BRAND.yellow,boxShadow:`4px 4px 0 ${BRAND.blue}`} };
  const v = variants[variant] || variants.primary;
  return <button onClick={disabled?undefined:onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,...v,...style, boxShadow:hov&&!disabled?'none':v.boxShadow, transform:hov&&!disabled?'translate(2px,2px)':'none'}}>{children}</button>;
}
function Eyebrow({ children, style={} }) {
  return <span style={{ fontFamily:"'Press Start 2P',monospace", fontSize:'9px', color:BRAND.blue, letterSpacing:'0.08em', display:'block', marginBottom:'6px', ...style }}>{children}</span>;
}
function Card({ children, style={}, onClick }) {
  const [hov, setHov] = React.useState(false);
  return <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{ background:BRAND.white, border:`3px solid ${BRAND.charcoal}`, boxShadow:hov&&onClick?pxSm():px(), transform:hov&&onClick?'translate(2px,2px)':'none', transition:'box-shadow 0.08s,transform 0.08s', cursor:onClick?'pointer':'default', ...style }}>{children}</div>;
}
function TrendArrow({ value }) {
  return <span style={{ color:value>=0?BRAND.green:BRAND.red, fontSize:'18px', lineHeight:1 }}>{value>=0?'▲':'▼'}</span>;
}
function TabBar({ tabs, active, onSelect, style={} }) {
  return <div style={{ display:'flex', borderBottom:`3px solid ${BRAND.charcoal}`, ...style }}>{tabs.map(t=><button key={t} onClick={()=>onSelect(t)} style={{ fontFamily:"'Press Start 2P',monospace", fontSize:'9px', padding:'10px 14px', border:'none', borderRight:`2px solid ${BRAND.charcoal}`, borderBottom:active===t?`3px solid ${BRAND.yellow}`:'3px solid transparent', background:active===t?BRAND.pageBed:BRAND.white, color:active===t?BRAND.blue:BRAND.charcoal, cursor:'pointer', letterSpacing:'0.04em', marginBottom:'-3px' }}>{t}</button>)}</div>;
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { id:'dashboard', label:'Dashboard', icon:'◈', badge:null },
  { id:'customers', label:'Customers', icon:'◉', badge:3 },
  { id:'revenue',   label:'Revenue',   icon:'◆', badge:5 },
  { id:'reference', label:'Rate Cards',icon:'⊞', badge:null },
  { id:'platform',  label:'Platform',  icon:'⊙', badge:1 },
  { id:'audit',     label:'Audit Log', icon:'≡', badge:null },
  { id:'security',  label:'Security',  icon:'⊕', badge:2 },
  { id:'tickets',   label:'Tickets',   icon:'✉', badge:4 },
];
function Sidebar({ active, onNavigate, collapsed }) {
  return (
    <aside style={{ width:collapsed?'60px':'220px', minHeight:'100vh', background:BRAND.charcoal, display:'flex', flexDirection:'column', borderRight:`3px solid ${BRAND.charcoal}`, transition:'width 0.18s', flexShrink:0, zIndex:10 }}>
      <div style={{ padding:collapsed?'16px 10px':'20px 18px', borderBottom:'3px solid rgba(255,255,255,0.12)', display:'flex', alignItems:'center', gap:'10px', minHeight:'72px' }}>
        <div style={{ width:'32px', height:'32px', flexShrink:0, background:BRAND.blue, border:`2px solid ${BRAND.yellow}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'18px', boxShadow:`2px 2px 0 ${BRAND.yellow}` }}>🐄</div>
        {!collapsed && <div><div style={{ fontFamily:"'Black Han Sans',sans-serif", fontSize:'13px', color:BRAND.white, textTransform:'uppercase', lineHeight:1.1 }}>SHIPPING<br/>COW</div><span style={{ fontFamily:"'Press Start 2P',monospace", fontSize:'7px', color:BRAND.yellow }}>// ADMIN</span></div>}
      </div>
      <nav style={{ flex:1, padding:'12px 0' }}>
        {NAV_ITEMS.map(item => {
          const isActive = active === item.id;
          return (
            <button key={item.id} onClick={()=>onNavigate(item.id)} title={collapsed?item.label:undefined}
              style={{ width:'100%', display:'flex', alignItems:'center', gap:'10px', padding:collapsed?'12px 0':'11px 18px', justifyContent:collapsed?'center':'flex-start', background:isActive?BRAND.blue:'transparent', border:'none', borderLeft:isActive?`3px solid ${BRAND.yellow}`:'3px solid transparent', cursor:'pointer', position:'relative' }}
              onMouseEnter={e=>{if(!isActive)e.currentTarget.style.background='rgba(255,255,255,0.07)';}}
              onMouseLeave={e=>{if(!isActive)e.currentTarget.style.background='transparent';}}>
              <span style={{ fontSize:'16px', color:isActive?BRAND.yellow:BRAND.sky, lineHeight:1, flexShrink:0 }}>{item.icon}</span>
              {!collapsed && <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'13px', fontWeight:isActive?'700':'500', color:isActive?BRAND.white:'rgba(255,255,255,0.75)', flex:1, textAlign:'left' }}>{item.label}</span>}
              {!collapsed && item.badge && <span style={{ fontFamily:"'Press Start 2P',monospace", fontSize:'8px', background:BRAND.red, color:BRAND.white, padding:'2px 5px', border:`2px solid ${BRAND.charcoal}`, minWidth:'20px', textAlign:'center' }}>{item.badge}</span>}
              {collapsed && item.badge && <span style={{ position:'absolute', top:'6px', right:'6px', width:'8px', height:'8px', background:BRAND.red, border:`1px solid ${BRAND.charcoal}` }}></span>}
            </button>
          );
        })}
      </nav>
      <div style={{ padding:collapsed?'12px 8px':'14px 16px', borderTop:'3px solid rgba(255,255,255,0.12)' }}>
        {!collapsed ? (
          <div>
            <div style={{ fontFamily:"'Press Start 2P',monospace", fontSize:'7px', color:BRAND.sky, marginBottom:'4px' }}>// SUPER-ADMIN</div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'12px', color:'rgba(255,255,255,0.8)', marginBottom:'10px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>founder@shippingcow.com</div>
            <button style={{ width:'100%', fontFamily:"'Press Start 2P',monospace", fontSize:'8px', padding:'7px', background:'transparent', border:'2px solid rgba(255,255,255,0.25)', color:'rgba(255,255,255,0.6)', cursor:'pointer' }}>SIGN OUT</button>
          </div>
        ) : (
          <div style={{ width:'32px', height:'32px', background:BRAND.blue, border:`2px solid ${BRAND.sky}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px', color:BRAND.white, margin:'0 auto' }}>F</div>
        )}
      </div>
    </aside>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function DashboardSection() {
  const [mrrPeriod, setMrrPeriod] = React.useState('12mo');
  const kpis = [
    { label:'MRR', value:'$84,200', trend:12.4, sub:'vs last month' },
    { label:'ACTIVE ORGS', value:'1,247', trend:8.1, sub:'30d growth' },
    { label:'NEW SIGNUPS (30D)', value:'143', trend:-2.3, sub:'vs prior 30d' },
    { label:'CALF→COW (30D)', value:'18.4%', trend:3.1, sub:'conversion' },
    { label:'CHURN RISK', value:'37', trend:-5.0, sub:'0 uploads / 30d' },
    { label:'FAILED PAYMENTS', value:'12', trend:4.2, sub:'needs action' },
  ];
  const mrrData = [
    {month:'Jun',new:8200,expansion:3100,churned:1200},{month:'Jul',new:9400,expansion:3800,churned:1500},
    {month:'Aug',new:10100,expansion:4200,churned:1400},{month:'Sep',new:11200,expansion:4800,churned:1800},
    {month:'Oct',new:12400,expansion:5200,churned:2100},{month:'Nov',new:13800,expansion:5900,churned:2300},
    {month:'Dec',new:15200,expansion:6400,churned:2600},{month:'Jan',new:16100,expansion:7100,churned:2800},
    {month:'Feb',new:17400,expansion:7600,churned:3100},{month:'Mar',new:18900,expansion:8200,churned:3400},
    {month:'Apr',new:20200,expansion:8900,churned:3700},{month:'May',new:21800,expansion:9400,churned:4000},
  ];
  const alerts = [
    {type:'New Bull onboarding request',org:'Titan Outdoor Gear',severity:'critical',time:'2m ago'},
    {type:'Payment failure',org:'BluePeak Supplies',severity:'critical',time:'14m ago'},
    {type:'AM assignment SLA breach',org:'HeavyLift Co.',severity:'critical',time:'1h ago'},
    {type:'Payment failure, 2nd retry',org:'KitchenPro Direct',severity:'high',time:'2h ago'},
    {type:'Churn risk',org:'Coastal Freight',severity:'high',time:'4h ago'},
    {type:'Org health score drop',org:'RedRock Wholesale',severity:'high',time:'6h ago'},
    {type:'AI cost spike',org:'Summit Outdoors',severity:'medium',time:'8h ago'},
    {type:'Suspended, no resolution',org:'LakeView Goods',severity:'medium',time:'3d ago'},
  ];
  const health = [
    {label:'MOOOVY API',value:'99.2%',sub:'p50: 380ms · p95: 920ms',status:'ok'},
    {label:'AI SPEND TODAY',value:'$42.80',sub:'61% of $70 daily budget',status:'ok'},
    {label:'EDGE FN ERRORS',value:'3 errors',sub:'0.04% rate / last 1h',status:'warn'},
    {label:'STRIPE WEBHOOKS',value:'Healthy',sub:'1,284 delivered / 24h',status:'ok'},
  ];
  const periods = {'3mo':3,'6mo':6,'12mo':12};
  const vis = mrrData.slice(-periods[mrrPeriod]);
  const maxV = Math.max(...mrrData.map(d=>d.new+d.expansion));
  const W=480,H=120;
  const pts = (data,key) => data.map((d,i)=>`${(i/(data.length-1))*(W-40)+20},${H-20-(d[key]/maxV)*(H-30)}`).join(' ');
  return (
    <div style={{padding:'28px',background:BRAND.pageBed,minHeight:'100%'}}>
      <div style={{marginBottom:'24px'}}><Eyebrow>// 01 — COMMAND DASHBOARD</Eyebrow><h1 style={{fontFamily:"'Black Han Sans',sans-serif",fontSize:'32px',color:BRAND.charcoal,textTransform:'uppercase',lineHeight:1}}>Platform Overview</h1></div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'12px',marginBottom:'24px'}}>

      <div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:'16px',marginBottom:'16px'}}>
        <Card style={{padding:'20px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
            <div><Eyebrow>// MRR TREND</Eyebrow><div style={{fontFamily:"'Black Han Sans',sans-serif",fontSize:'18px',color:BRAND.charcoal,textTransform:'uppercase'}}>Revenue Chart</div></div>
            <div style={{display:'flex',gap:'4px'}}>{['3mo','6mo','12mo'].map(p=><button key={p} onClick={()=>setMrrPeriod(p)} style={{fontFamily:"'Press Start 2P',monospace",fontSize:'8px',padding:'5px 8px',background:mrrPeriod===p?BRAND.blue:BRAND.white,color:mrrPeriod===p?BRAND.white:BRAND.charcoal,border:`2px solid ${BRAND.charcoal}`,cursor:'pointer'}}>{p}</button>)}</div>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
            {[0.25,0.5,0.75,1].map(f=><line key={f} x1="20" y1={H-20-f*(H-30)} x2={W-20} y2={H-20-f*(H-30)} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="3,3"/>)}

            <polyline points={pts(vis,'expansion')} fill="none" stroke={BRAND.teal} strokeWidth="2.5"/>

          </svg>
          <div style={{display:'flex',gap:'16px',marginTop:'8px'}}>
            {[['New MRR',BRAND.green],['Expansion',BRAND.teal],['Churned',BRAND.red]].map(([l,c])=><div key={l} style={{display:'flex',alignItems:'center',gap:'6px'}}><div style={{width:'16px',height:'3px',background:c}}></div><span style={{fontFamily:"'Press Start 2P',monospace",fontSize:'8px',color:'#6B7280'}}>{l}</span></div>)}

            <div style={{fontFamily:"'Black Han Sans',sans-serif",fontSize:'16px',color:BRAND.white,textTransform:'uppercase'}}>{alerts.length} Active Alerts</div>
          </div>
          <div style={{overflow:'auto',maxHeight:'340px'}}>
            {alerts.map((a,i)=><div key={i} style={{padding:'10px 14px',borderBottom:`2px solid ${BRAND.pageBed}`,display:'flex',flexDirection:'column',gap:'4px',background:i%2===0?BRAND.white:BRAND.pageBed,cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background=BRAND.sky+'44'} onMouseLeave={e=>e.currentTarget.style.background=i%2===0?BRAND.white:BRAND.pageBed}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><SeverityBadge level={a.severity}/><span style={{fontFamily:"'Press Start 2P',monospace",fontSize:'8px',color:'#9CA3AF'}}>{a.time}</span></div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:'13px',fontWeight:'600',color:BRAND.charcoal}}>{a.type}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:'12px',color:'#6B7280'}}>{a.org}</div>
            </div>)}
          </div>
        </Card>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px'}}>
        {health.map((t,i)=><Card key={i} style={{padding:'16px',borderLeft:`4px solid ${t.status==='ok'?BRAND.green:BRAND.amber}`}}>
          <Eyebrow style={{fontSize:'8px',color:'#6B7280'}}>{t.label}</Eyebrow>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:'22px',fontWeight:'700',color:BRAND.charcoal,margin:'4px 0'}}>{t.value}</div>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:'8px',color:'#9CA3AF',lineHeight:1.6}}>{t.sub}</div>
          <div style={{marginTop:'8px',width:'8px',height:'8px',background:t.status==='ok'?BRAND.green:BRAND.amber,border:`2px solid ${BRAND.charcoal}`}}></div>
        </Card>)}
      </div>
    </div>
  );
}

function TicketThread({ ticket, onStatusChange, onViewOrg }) {
  const [reply, setReply] = React.useState('');
  const [noteMode, setNoteMode] = React.useState(false);
  const [msgs, setMsgs] = React.useState(ticket.messages);
  const [status, setStatus] = React.useState(ticket.status);
  const threadRef = React.useRef(null);

  React.useEffect(() => {
    setMsgs(ticket.messages);
    setStatus(ticket.status);
    setReply('');
    setNoteMode(false);
  }, [ticket.id]);

  const sendReply = () => {
    if (!reply.trim()) return;
    const newMsg = { id: 'm'+Date.now(), from: noteMode ? 'note' : 'admin', author: 'founder@shippingcow.com', avatar: 'SC', ts: new Date().toISOString().slice(0,16).replace('T',' '), body: reply };
    setMsgs(prev => [...prev, newMsg]);
    setReply('');
  };

  const cycleStatus = () => {
    const order = ['open','in_progress','resolved'];
    const next = order[(order.indexOf(status)+1) % order.length];
    setStatus(next);
    onStatusChange && onStatusChange(ticket.id, next);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:BRAND.white }}>
      {/* Thread header */}
      <div style={{ padding:'16px 20px', borderBottom:`3px solid ${BRAND.charcoal}`, background:BRAND.charcoal, flexShrink:0 }}>

            <div style={{ fontFamily:"'Black Han Sans',sans-serif", fontSize:'16px', color:BRAND.white, textTransform:'uppercase', lineHeight:1.2, marginBottom:'8px' }}>{ticket.subject}</div>
            <div style={{ display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap' }}>

            </div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:'6px', alignItems:'flex-end', flexShrink:0 }}>

    </div>
  );

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ children }) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (<><style>{__TWEAKS_STYLE}</style><div className="twk-panel"><div className="twk-hd"><b>// TWEAKS</b><button className="twk-x" onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div></>);
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakToggle({ label, value, onChange }) {
  return <div className="twk-row twk-row-h"><div className="twk-lbl"><span>{label}</span></div><button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={()=>onChange(!value)}><i/></button></div>;
}
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o=>typeof o==='object'?o:{value:o,label:o});
  const idx = Math.max(0,opts.findIndex(o=>o.value===value));
  const n = opts.length;
  return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div><div className="twk-seg">{opts.map((o,i)=><button key={o.value} type="button" role="radio" aria-checked={o.value===value} style={{background:o.value===value?'#0052C9':'transparent',color:o.value===value?'#fff':'#1A202C'}} onClick={()=>onChange(o.value)}>{o.label}</button>)}</div></div>;
}

        <div style={{flex:1,overflow:page==='tickets'?'hidden':'auto'}}>
          {page==='tickets'
            ? <TicketsSection onViewOrg={(orgId)=>{ setPage('customers'); }}/>
            : <PageComp/>
          }
        </div>
      </main>

      <TweaksPanel>
        <TweakSection label="Layout"/>
        <TweakToggle label="Collapse Sidebar" value={tweaks.sidebarCollapsed} onChange={v=>setTweak('sidebarCollapsed',v)}/>
        <TweakRadio label="Density" value={tweaks.density} options={['compact','comfortable','spacious']} onChange={v=>setTweak('density',v)}/>
        <TweakSection label="Navigate to"/>
        {Object.keys(PAGES).map(p=><button key={p} onClick={()=>setPage(p)} style={{width:'100%',textAlign:'left',padding:'6px 8px',fontFamily:"'Press Start 2P',monospace",fontSize:'8px',background:page===p?BRAND.blue:'transparent',color:page===p?BRAND.white:BRAND.charcoal,border:`2px solid ${page===p?BRAND.blue:'#e5e7eb'}`,cursor:'pointer',marginBottom:'3px'}}>{p.toUpperCase()}</button>)}
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
